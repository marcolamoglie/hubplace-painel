<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hubplace · Máquinas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  /* ==================================================================
     PAINEL DE CONTROLE, NAO DASHBOARD

     Cinco Macs em duas revendas de Orlando, cada um numa conta do
     Facebook, publicando carro e respondendo comprador. Quem abre esta
     tela e o dono, do celular, longe da loja. A pergunta dele nao e "as
     maquinas estao de pe" - isso se responde em dois segundos e depois
     nao serve para nada. E "quem esta esperando por mim, e ha quanto
     tempo": telefone captado que ninguem ligou envelhece e morre.

     Por isso: o herói é a FILA, e todo número é INSTRUMENTO. O relógio
     de idade em mono, esquentando de verde a vermelho, é o mesmo em toda
     a tela - fila, máquina, conversa. A barra escura da esquerda é a
     régua de lâmpadas: cinco luzes, uma por conta.

     Papel e tinta do Hubplace; limão só na marca; verde é dinheiro
     (telefone, venda); vermelho é o que envelheceu.
     ================================================================== */
  :root {
    /* O design system do grupo (o mesmo do Hub): asfalto de patio, papel de
       nota. Desde 26/09/2026 todas as maquinas sao Fastline, entao o acento
       e o dourado da Fastline - so marca, foco e acao. */
    --papel:#FBFAF8; --caixa:#FFFFFF; --nevoa:#F2F0EC; --fina:#F6F5F2; --linha:#E4E1DC; --linha-2:#EFEDE9;
    --tinta:#1A1D21; --tinta-2:#39414A; --tinta-3:#6B7480; --tinta-4:#A7AEB7;
    --laje:#1A1D21; --laje-2:#13161A; --laje-texto:#A7AEB7; --laje-claro:#FBFAF8;
    --ouro:#C2871F; --ouro-ink:#9A6A12; --ouro-luz:#FBF1DF;
    --laje-raised:rgba(255,255,255,.07); --laje-hover:rgba(255,255,255,.045); --laje-line:rgba(255,255,255,.09);
    --neon:#C6FF3D; --online:#34C98E;
    --marca:#F26522; --marca-ink:#C0562A; --marca-luz:#FFF1E9;
    --dinheiro:#0F7A57; --dinheiro-luz:#E4F3EC;
    --brasa:#C23B2E; --brasa-luz:#FBEBE8;
    --ambar:#B7791F; --ambar-ink:#8A5A12; --ambar-luz:#FBF3E4;
    --sombra:0 1px 2px rgba(20,21,26,.05);
    --sans:"Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --titulo:var(--sans);
    /* numero e leitura de instrumento: mesma familia, algarismos tabulares */
    --dado:var(--sans);
    --rail:228px;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --papel:#14171B; --caixa:#1B1F24; --nevoa:#242930; --fina:#20242A; --linha:#2C3239; --linha-2:#252A31;
      --tinta:#F1F2F4; --tinta-2:#C7CCD3; --tinta-3:#8E96A1; --tinta-4:#5F6772;
      --laje:#0E1114; --laje-2:#090B0D;
      --ouro:#E0A93F; --ouro-ink:#E8BD66; --ouro-luz:#33291A;
      --marca:#F26522; --marca-ink:#F58E5C; --marca-luz:#33221A;
      --dinheiro:#3FBF8C; --dinheiro-luz:#163327;
      --brasa:#E8756A; --brasa-luz:#38201D;
      --ambar:#D9A44A; --ambar-ink:#E4BC72; --ambar-luz:#322812;
      --sombra:0 1px 2px rgba(0,0,0,.45);
      color-scheme:dark;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--papel); color:var(--tinta); font:14px/1.5 var(--sans); -webkit-font-smoothing:antialiased; font-feature-settings:"tnum" 1, "cv11" 1; }
  [hidden] { display:none !important; }
  button, input { font:inherit; color:inherit; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }

  /* ---------------------------------------------- a régua de lâmpadas --- */
  .app { display:grid; grid-template-columns:var(--rail) minmax(0,1fr); min-height:100vh;
    /* a régua é uma coluna, não um bloco: a tinta desce até o fim da página */
    background:linear-gradient(to right, var(--laje) 0 var(--rail), var(--papel) var(--rail)); }
  .rail { background:var(--laje); color:var(--laje-texto); display:flex; flex-direction:column; position:sticky; top:0; height:100vh; user-select:none; }
  .rail .marca { display:flex; align-items:center; gap:9px; padding:18px 18px 16px; text-decoration:none; cursor:pointer; }
  .rail .marca:hover b { color:#fff; }
  /* No desktop a marca e o caminho de volta para a fila, entao "Agora" seria
     uma linha repetida. No celular a marca nao cabe na barra de baixo: la ele
     e a unica saida, e volta. */
  .rail a.so-celular { display:none; }
  .rail .marca:focus-visible { outline:2px solid var(--lateral-ativo); outline-offset:-4px; border-radius:10px; }
  .rail .marca svg { width:21px; height:21px; flex:none; display:block; color:var(--laje-claro); }
  .rail .marca b { font-family:var(--titulo); font-weight:900; font-size:14px; letter-spacing:-.05em; color:var(--laje-claro); }
  .rail .marca b i { font-style:normal; color:var(--neon); }

  .rail nav { display:flex; flex-direction:column; padding:0 10px; overflow-y:auto; }
  .rail .grupo { font:600 10px/1 var(--dado); letter-spacing:.14em; text-transform:uppercase; color:var(--laje-texto); opacity:.55; padding:16px 10px 8px; }
  .rail a { position:relative; display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:9px; text-decoration:none; color:var(--laje-texto); cursor:pointer; min-width:0; font-size:13px; font-weight:600; }
  .rail a:hover { color:var(--laje-claro); background:var(--laje-hover); }
  .rail a[aria-current="page"] { color:var(--laje-claro); background:var(--laje-raised); box-shadow:inset 0 0 0 1px var(--laje-line); }
  .rail a b { font-weight:inherit; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; flex:1; }
  .rail a .idade { font:600 11px/1 var(--dado); color:var(--laje-texto); opacity:.75; flex:none; }
  .rail a .fila { font:700 11px/17px var(--dado); min-width:18px; height:18px; padding:0 5px; border-radius:999px; text-align:center; background:var(--laje-raised); color:var(--laje-claro); box-shadow:inset 0 0 0 1px var(--laje-line); flex:none; }
  .rail a .fila.velha { background:var(--brasa); color:#fff; box-shadow:none; }
  .rail a svg.grade { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8; flex:none; opacity:.8; }

  /* a lâmpada: acesa com brilho, apagada como contorno. É o desenho que o
     app usa nas luzes de sistema, e aqui vira a identidade da barra. */
  .luz { width:8px; height:8px; border-radius:50%; flex:none; background:transparent; box-shadow:inset 0 0 0 1.5px var(--laje-texto); opacity:.55; }
  .luz.ok { background:var(--online); box-shadow:0 0 0 3px rgba(52,201,142,.16); opacity:1; }
  .luz.atencao { background:#E2B34A; box-shadow:0 0 0 3px rgba(226,179,74,.16); opacity:1; }
  .luz.ruim { background:#F07C6C; box-shadow:0 0 0 3px rgba(240,124,108,.18); opacity:1; }

  .rail .pe { margin-top:auto; padding:12px 20px 14px; font:500 10.5px/1.4 var(--dado); color:var(--laje-texto); opacity:.6; border-top:1px solid var(--laje-line); }
  .rail .pe button { display:block; margin-top:6px; background:none; border:0; padding:0; color:inherit; font:inherit; cursor:pointer; text-decoration:underline; text-underline-offset:2px; }
  .rail .pe button:hover { color:var(--laje-claro); }

  /* --------------------------------------------------------- conteúdo --- */
  main { min-width:0; display:flex; flex-direction:column; }
  .folha { padding:26px 32px 72px; max-width:1180px; width:100%; }
  @media (max-width:900px) { .folha { padding:20px 18px 48px; } }

  /* o cabeçalho de seção: eyebrow em mono + título display */
  .secao { margin:44px 0 0; }
  .secao:first-child { margin-top:0; }
  .olho { font:600 10.5px/1 var(--dado); letter-spacing:.16em; text-transform:uppercase; color:var(--tinta-3); display:flex; align-items:center; gap:10px; }
  .olho::after { content:""; flex:1; height:1px; background:var(--linha); }
  .titulo { font-family:var(--titulo); font-weight:900; letter-spacing:-.045em; margin:12px 0 0; }
  h1.titulo { font-size:clamp(26px, 3.4vw, 38px); line-height:1.05; }
  h2.titulo { font-size:19px; line-height:1.2; }
  .sub { color:var(--tinta-3); font-size:13.5px; margin-top:6px; max-width:62ch; }

  /* o relógio de idade: o instrumento que se repete na tela inteira */
  .idade { font:700 13px/1 var(--dado); letter-spacing:-.02em; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .idade.frio { color:var(--tinta-4); }
  .idade.verde { color:var(--dinheiro); }
  .idade.ambar { color:var(--ambar-ink); }
  .idade.vermelho { color:var(--brasa); }

  .num { font-family:var(--dado); font-variant-numeric:tabular-nums; letter-spacing:-.02em; }

  /* ------------------------------------------------------------- fila --- */
  .fila-topo { display:flex; align-items:flex-end; gap:18px; flex-wrap:wrap; }
  .fila-topo .direita { margin-left:auto; display:flex; gap:8px; align-items:center; }
  .periodo { display:inline-flex; border:1px solid var(--linha); border-radius:9px; overflow:hidden; background:var(--caixa); }
  .periodo button { border:0; background:none; font:600 12px/1 var(--dado); letter-spacing:.02em; color:var(--tinta-3); padding:0 11px; min-height:32px; cursor:pointer; }
  .periodo button + button { border-left:1px solid var(--linha); }
  .periodo button[aria-pressed="true"] { background:var(--tinta); color:var(--papel); }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; border:1px solid var(--linha); border-radius:9px; background:var(--caixa); color:var(--tinta); padding:0 12px; min-height:32px; font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap; text-decoration:none; }
  .btn:hover { background:var(--fina); }
  .btn.tinta { background:var(--tinta); border-color:var(--tinta); color:var(--papel); }
  .btn:focus-visible, input:focus-visible, .linha:focus-visible, .rail a:focus-visible, .periodo button:focus-visible, .aba:focus-visible { outline:2px solid var(--marca); outline-offset:2px; }

  /* cada item da fila é uma linha alta, clicável, com o relógio na frente:
     a idade é o que decide a ordem de ligar, então vem primeiro */
  .lista { margin-top:18px; border-top:1px solid var(--linha); max-width:940px; }
  .linha { display:grid; grid-template-columns:64px minmax(0,1fr) auto; align-items:center; gap:16px; width:100%; text-align:left; background:none; border:0; border-bottom:1px solid var(--linha-2); padding:14px 6px; cursor:pointer; position:relative; }
  .linha:hover { background:var(--caixa); }
  .linha::before { content:""; position:absolute; left:-6px; top:0; bottom:0; width:2px; background:transparent; }
  .linha:hover::before { background:var(--marca); }
  .linha .quem { font-weight:700; font-size:15px; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .linha .onde { color:var(--tinta-3); font-size:12.5px; margin-top:2px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .linha .direita { display:flex; align-items:center; gap:12px; }
  .fone { font:700 13px/1 var(--dado); color:var(--dinheiro); white-space:nowrap; text-decoration:none; }
  .fone:hover { text-decoration:underline; }
  /* ligar e passar adiante moram na propria linha: e o que o dono faz com ela */
  .icone { display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; border:1px solid var(--linha); border-radius:8px; background:var(--caixa); color:var(--tinta-2); cursor:pointer; padding:0; flex:none; }
  .icone:hover { border-color:var(--tinta-4); color:var(--tinta); }
  .icone svg { width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .icone.feito { color:var(--dinheiro); border-color:color-mix(in srgb, var(--dinheiro) 45%, var(--linha)); }
  .como-link { border:0; background:none; padding:0; font:inherit; color:var(--tinta); font-weight:650; text-decoration:underline; text-underline-offset:2px; cursor:pointer; }
  .metricas.escopos { margin-bottom:0; }
  .marca-motivo { font:700 10px/1 var(--dado); letter-spacing:.1em; text-transform:uppercase; padding:4px 7px; border-radius:5px; background:var(--fina); color:var(--tinta-3); }
  .marca-motivo.telefone { background:var(--dinheiro-luz); color:var(--dinheiro); }
  .marca-motivo.escalada { background:var(--ambar-luz); color:var(--ambar-ink); }

  .vazio-fila { margin-top:20px; padding:22px 24px; border:1px dashed var(--linha); border-radius:12px; color:var(--tinta-3); font-size:13.5px; }
  .vazio-fila b { display:block; color:var(--tinta); font-family:var(--titulo); font-weight:900; font-size:19px; letter-spacing:-.03em; margin-bottom:5px; }

  /* ---------------------------------------------------------- máquinas --- */
  .maquinas { margin-top:18px; border-top:1px solid var(--linha); }
  .maq { display:grid; grid-template-columns:14px minmax(0,1.5fr) minmax(0,1.2fr) 96px auto; align-items:center; gap:16px; width:100%; text-align:left; background:none; border:0; border-bottom:1px solid var(--linha-2); padding:13px 6px; cursor:pointer; position:relative; }
  .maq:hover { background:var(--caixa); }
  .maq::before { content:""; position:absolute; left:-6px; top:0; bottom:0; width:2px; background:transparent; }
  .maq:hover::before { background:var(--marca); }
  .maq .nome { font-weight:700; font-size:14.5px; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .maq .conta { color:var(--tinta-3); font-size:12px; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .maq .faz { color:var(--tinta-2); font-size:12.5px; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .maq .faz.alerta { color:var(--brasa); font-weight:600; }
  .maq .hoje { display:flex; gap:14px; justify-content:flex-end; }
  .maq .hoje div { text-align:right; }
  .maq .hoje b { display:block; font:700 15px/1.1 var(--dado); }
  .maq .hoje b.zero { color:var(--tinta-4); font-weight:500; }
  .maq .hoje b.bom { color:var(--dinheiro); }
  .maq .hoje small { display:block; font:500 9.5px/1 var(--dado); letter-spacing:.1em; text-transform:uppercase; color:var(--tinta-4); }
  .traco svg { display:block; width:100%; height:26px; }
  .traco.alto svg { height:120px; }
  .traco .legenda { display:flex; justify-content:space-between; gap:12px; margin-top:6px; font:500 10.5px/1 var(--dado); letter-spacing:.06em; text-transform:uppercase; color:var(--tinta-4); }

  /* -------------------------------------------------------- no período --- */
  .placar { margin-top:18px; }
  .metricas { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:18px; }
  .metricas button { border:1px solid var(--linha); background:var(--caixa); color:var(--tinta-3); border-radius:999px; padding:5px 12px; min-height:30px; font-size:12.5px; font-weight:600; cursor:pointer; }
  .metricas button[aria-pressed="true"] { background:var(--tinta); border-color:var(--tinta); color:var(--papel); }
  .barra-linha { display:grid; grid-template-columns:minmax(120px,190px) minmax(0,1fr) 62px; align-items:center; gap:14px; padding:7px 0; }
  .barra-linha .r { font-size:13.5px; font-weight:600; }
  .barra-linha .r span { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .barra-linha .r small { display:block; font-weight:400; color:var(--tinta-4); font-size:11.5px; line-height:1.3; }
  .barra-linha i { height:26px; border-radius:4px; background:var(--nevoa); display:block; position:relative; }
  .barra-linha i::after { content:""; position:absolute; inset:0; width:var(--w); border-radius:4px; background:var(--tinta-4); }
  .barra-linha.lider i::after { background:var(--tinta); }
  .barra-linha.lider .r { font-weight:800; }
  .barra-linha .v { font:700 14px/1 var(--dado); text-align:right; }
  .bloco .barra-linha { grid-template-columns:104px minmax(0,1fr) auto; gap:10px; }
  .bloco .barra-linha i { height:20px; }
  .bloco .barra-linha .v small { font-weight:500; color:var(--tinta-4); margin-left:5px; }
  .barra-linha.sem .v, .barra-linha.sem .r { color:var(--tinta-4); }
  .veredito { margin:18px 0 0; font-size:14.5px; line-height:1.55; max-width:70ch; color:var(--tinta-2); }
  .veredito b { color:var(--tinta); font-weight:800; }
  details.tabela { margin-top:20px; }
  details.tabela summary { cursor:pointer; font:600 12px/1 var(--dado); letter-spacing:.06em; text-transform:uppercase; color:var(--tinta-3); padding:8px 0; }
  details.tabela summary:hover { color:var(--tinta); }
  details.tabela[open] summary { margin-bottom:8px; }

  .rolagem { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; font:600 10px/1 var(--dado); letter-spacing:.1em; text-transform:uppercase; color:var(--tinta-3); padding:8px 14px 8px 0; border-bottom:1px solid var(--linha); white-space:nowrap; }
  td { padding:11px 14px 11px 0; border-bottom:1px solid var(--linha-2); color:var(--tinta-2); vertical-align:middle; }
  tr:last-child td { border-bottom:0; }
  th.n, td.n { text-align:right; font-family:var(--dado); font-variant-numeric:tabular-nums; white-space:nowrap; padding-right:0; }
  th.n { padding-right:0; }
  td.forte { color:var(--tinta); font-weight:650; white-space:nowrap; }
  td.forte small { display:block; font-weight:400; color:var(--tinta-4); font-size:11.5px; font-family:var(--sans); }
  /* quantas vezes o anuncio foi renovado, embaixo da data de publicacao (como no app) */
  td small.renov { display:block; font-weight:400; color:var(--tinta-4); font-size:11px; font-family:var(--sans); white-space:nowrap; }
  /* a sentinela do historico desta maquina: a promessa "toda mensagem continua aqui", conferida */
  .capa .historico { margin:6px 0 0; font-size:12px; color:var(--tinta-3); }
  .capa .historico.ruim { color:var(--brasa); font-weight:650; }
  /* hora aproximada: o Facebook so mostra a hora do grupo de mensagens */
  .balao .meta .aprox { cursor:help; border-bottom:1px dotted currentColor; }
  td.sem, .sem { color:var(--tinta-4); }
  .lider-n { color:var(--dinheiro); font-weight:700; }

  /* ------------------------------------------------- dentro da máquina --- */
  .capa { display:flex; align-items:flex-start; gap:16px; flex-wrap:wrap; }
  .capa .voltar { border:0; background:none; padding:0 0 8px; color:var(--tinta-3); font-size:12.5px; font-weight:600; cursor:pointer; display:inline-flex; gap:6px; }
  .capa .voltar:hover { color:var(--tinta); }
  .capa .direita { margin-left:auto; text-align:right; display:flex; align-items:center; gap:12px; }
  .pilula { display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:999px; font:700 10.5px/1.4 var(--dado); letter-spacing:.06em; text-transform:uppercase; background:var(--fina); color:var(--tinta-2); white-space:nowrap; }
  .pilula.ok { background:var(--dinheiro-luz); color:var(--dinheiro); }
  .pilula.atencao { background:var(--ambar-luz); color:var(--ambar-ink); }
  .pilula.ruim { background:var(--brasa-luz); color:var(--brasa); }

  /* o painel de instrumentos: números grandes em mono, sem caixa em volta */
  /* Flex, não grid: com cinco instrumentos numa tela estreita a grade
     deixava um quadrado cinza sobrando na última linha. Aqui o que sobra é
     dividido entre os instrumentos daquela linha. */
  .instrumentos { display:flex; flex-wrap:wrap; border:1px solid var(--linha); border-radius:12px; overflow:hidden; margin-top:22px; background:var(--papel); }
  .instrumentos div { flex:1 1 150px; padding:14px 16px; border-left:1px solid var(--linha); }
  .instrumentos div:first-child { border-left:0; }
  .instrumentos small { font:600 10px/1 var(--dado); letter-spacing:.12em; text-transform:uppercase; color:var(--tinta-3); }
  .instrumentos b { display:block; font:700 26px/1.1 var(--dado); letter-spacing:-.03em; margin-top:7px; }
  .instrumentos b em { font-style:normal; font-size:13px; font-weight:600; color:var(--tinta-4); margin-left:3px; }
  .instrumentos b.vazio { color:var(--tinta-4); }
  .instrumentos p { margin:5px 0 0; font-size:12px; color:var(--tinta-3); line-height:1.35; }
  .instrumentos p.bom { color:var(--dinheiro); font-weight:600; }
  .instrumentos p.ruim { color:var(--brasa); font-weight:600; }

  .abas { display:flex; gap:2px; margin:34px 0 0; border-bottom:1px solid var(--linha); flex-wrap:wrap; }
  .aba { border:0; background:none; color:var(--tinta-3); font-size:13px; font-weight:600; padding:9px 12px 11px; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .aba:hover { color:var(--tinta); }
  .aba[aria-selected="true"] { color:var(--tinta); border-bottom-color:var(--tinta); }
  .aba .c { font-family:var(--dado); font-size:11px; color:var(--tinta-4); margin-left:5px; }
  .aba[aria-selected="true"] .c { color:var(--tinta-2); }

  /* caixa de entrada: lista à esquerda, conversa à direita. Ler a conversa
     não pode empurrar a lista para fora da tela. */
  .inbox { display:grid; grid-template-columns:340px minmax(0,1fr); gap:0; margin-top:20px; border:1px solid var(--linha); border-radius:12px; background:var(--caixa); overflow:hidden;
    height:clamp(520px, calc(100vh - 260px), 820px); }
  .inbox .coluna { border-right:1px solid var(--linha); display:flex; flex-direction:column; min-width:0; }
  .filtros { display:flex; gap:2px; padding:8px 10px 0; border-bottom:1px solid var(--linha); flex-wrap:wrap; }
  .filtros button { border:0; background:none; font-size:12px; font-weight:600; color:var(--tinta-3); padding:6px 8px 9px; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap; }
  .filtros button[aria-pressed="true"] { color:var(--tinta); border-bottom-color:var(--tinta); }
  .filtros button .c { font-family:var(--dado); font-size:10.5px; color:var(--tinta-4); margin-left:3px; }
  .busca { padding:8px 10px; border-bottom:1px solid var(--linha-2); }
  .busca input { width:100%; border:1px solid var(--linha); border-radius:8px; background:var(--papel); padding:6px 10px; font-size:12.5px; }
  .conversas { overflow-y:auto; flex:1; min-height:0; }
  .conv { display:flex; gap:10px; align-items:flex-start; width:100%; text-align:left; background:none; border:0; border-bottom:1px solid var(--linha-2); padding:11px 12px; cursor:pointer; position:relative; }
  .conv:hover { background:var(--fina); }
  .conv[aria-current="true"] { background:var(--nevoa); }
  .conv[aria-current="true"]::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--marca); }
  .ava { width:34px; height:34px; flex:none; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800; color:#fff; overflow:hidden; }
  /* a foto do comprador, quando a maquina mandou (10/10/2026); sem ela, a inicial */
  .ava img { width:100%; height:100%; object-fit:cover; display:block; }
  .conv .t { min-width:0; flex:1; }
  .conv .l1 { display:flex; align-items:baseline; gap:8px; }
  .conv .quem { font-weight:650; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .conv .l1 .idade { margin-left:auto; font-size:11px; font-weight:600; }
  .conv .carro { color:var(--tinta-3); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .conv .rodape { display:flex; align-items:center; gap:6px; margin-top:5px; flex-wrap:wrap; }
  .conv .bola { font-size:11.5px; color:var(--tinta-4); }
  .conv .bola.dele { color:var(--brasa); font-weight:650; }

  .papo { display:flex; flex-direction:column; min-width:0; background:var(--papel); overflow:hidden; }
  .papo .cab { display:flex; align-items:center; gap:12px; padding:12px 18px; border-bottom:1px solid var(--linha); background:var(--caixa); flex-wrap:wrap; }
  .papo .cab .quem { font-weight:700; font-size:15px; letter-spacing:-.01em; }
  .papo .cab .carro { color:var(--tinta-3); font-size:12.5px; }
  .papo .cab .direita { margin-left:auto; display:flex; align-items:center; gap:10px; }
  .papo .voltar-conv { display:none; }
  .rolo { padding:18px 20px 22px; overflow-y:auto; flex:1; min-height:0; display:flex; flex-direction:column; }
  .dia { align-self:stretch; display:flex; align-items:center; gap:10px; margin:12px 0 8px; }
  .dia::before, .dia::after { content:""; height:1px; flex:1; background:var(--linha); }
  .dia span { font:600 10px/1 var(--dado); letter-spacing:.1em; text-transform:uppercase; color:var(--tinta-4); }
  .balao { max-width:min(78%, 560px); padding:9px 13px; border-radius:14px; font-size:13.5px; line-height:1.45; white-space:pre-wrap; word-break:break-word; }
  .balao.comprador { align-self:flex-start; background:var(--caixa); border:1px solid var(--linha-2); border-bottom-left-radius:4px; }
  .balao.nossa { align-self:flex-end; background:var(--dinheiro-luz); border-bottom-right-radius:4px; }
  .balao .meta { display:flex; align-items:center; gap:5px; font:600 10px/1 var(--dado); letter-spacing:.06em; text-transform:uppercase; opacity:.6; margin-bottom:5px; }
  .balao.daIA .meta { opacity:1; color:var(--dinheiro); }
  .robo { display:inline-flex; color:currentColor; }
  .robo svg { width:11px; height:11px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; display:block; }
  .balao + .balao { margin-top:3px; }
  .balao.comprador + .balao.nossa, .balao.nossa + .balao.comprador { margin-top:14px; }
  .balao + .balao .meta { display:none; }
  .balao.comprador + .balao.nossa .meta, .balao.nossa + .balao.comprador .meta { display:flex; }
  .dia + .balao .meta { display:flex; }
  .ficha { display:flex; gap:8px; flex-wrap:wrap; padding:12px 18px; border-top:1px solid var(--linha-2); background:var(--caixa); }

  /* ------------------------------------------------- blocos de padrão --- */
  .grade { display:grid; gap:22px; grid-template-columns:repeat(auto-fit, minmax(320px,1fr)); margin-top:20px; }
  .bloco h3 { margin:0 0 3px; font-size:14px; font-weight:700; letter-spacing:-.01em; }
  .bloco p.d { margin:0 0 14px; font-size:12.5px; color:var(--tinta-3); }
  .barra { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 12px; margin:10px 0; font-size:13px; }
  .barra span.txt { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--tinta-2); }
  .barra b { font:700 13px/1 var(--dado); }
  .barra i { grid-column:1/-1; height:6px; border-radius:999px; background:var(--nevoa); display:block; position:relative; }
  .barra i::after { content:""; position:absolute; inset:0; width:var(--w); border-radius:999px; background:var(--tinta-4); }
  .barra.fone i::after { background:var(--dinheiro); }
  .horas { display:grid; grid-template-columns:repeat(24,1fr); gap:3px; align-items:end; height:70px; margin-top:8px; }
  .horas i { background:var(--tinta-4); border-radius:2px 2px 0 0; display:block; min-height:2px; }
  .horas i.pico { background:var(--tinta); }
  .horas-eixo { display:flex; justify-content:space-between; margin-top:6px; font:500 10px/1 var(--dado); color:var(--tinta-4); }

  .diario li { display:grid; grid-template-columns:76px 92px minmax(0,1fr); gap:14px; padding:10px 0; border-bottom:1px solid var(--linha-2); font-size:13px; align-items:start; list-style:none; }
  .diario { margin:18px 0 0; padding:0; border-top:1px solid var(--linha); }
  .diario .q { font:500 11.5px/1.5 var(--dado); color:var(--tinta-4); white-space:nowrap; }
  .diario .txt { color:var(--tinta-2); overflow-wrap:anywhere; }
  .diario .det { display:block; color:var(--tinta-4); font-size:12px; margin-top:2px; }
  .dia-sep { font:600 10px/1 var(--dado); letter-spacing:.12em; text-transform:uppercase; color:var(--tinta-3); padding:16px 0 6px; }

  .vazio { padding:34px 4px; color:var(--tinta-3); font-size:13.5px; }
  .vazio b { display:block; color:var(--tinta); font-family:var(--titulo); font-size:18px; font-weight:900; letter-spacing:-.03em; margin-bottom:5px; }
  .aviso { margin:0 0 20px; padding:12px 16px; border-radius:10px; background:var(--ambar-luz); color:var(--ambar-ink); font-size:13px; }
  .erro { margin:0 0 20px; padding:12px 16px; border-radius:10px; background:var(--brasa-luz); color:var(--brasa); font-size:13px; }
  .nota { font-size:12.5px; color:var(--tinta-3); margin:14px 0 0; max-width:70ch; }
  .carregando { padding:34px 4px; color:var(--tinta-4); font:500 12.5px/1 var(--dado); letter-spacing:.06em; text-transform:uppercase; }

  /* ---------------------------------------------------------- entrada --- */
  .entrada { max-width:340px; margin:16vh auto 0; padding:0 20px; }
  .entrada .marca { display:flex; align-items:center; gap:9px; margin-bottom:22px; }
  .entrada .marca svg { width:22px; height:22px; }
  .entrada .marca b { font-family:var(--titulo); font-weight:900; font-size:15px; letter-spacing:-.05em; }
  .entrada .marca b i { font-style:normal; color:#7AB800; }
  .entrada p { color:var(--tinta-3); font-size:13px; }
  .entrada form { display:flex; gap:8px; margin-top:14px; }
  .entrada input { flex:1; border:1px solid var(--linha); border-radius:9px; background:var(--caixa); padding:8px 12px; }

  /* ================================================== redesenho 13/10/2026 ===
     Mesma regua, outra leitura: rotulo em frase (nada de CAIXA ALTA
     espacada), uma familia so, cartao com raio 14 e quase sem sombra, e a
     acao morando na linha da pessoa. */
  .olho { font:500 13px/1.3 var(--sans); letter-spacing:0; text-transform:none; color:var(--tinta-3); }
  .olho::after { display:none; }
  .titulo { letter-spacing:-.035em; font-weight:800; }
  h1.titulo { font-size:clamp(26px, 3vw, 34px); line-height:1.1; margin-top:4px; }
  .rail .grupo, .instrumentos small, th, .maq .hoje small, .dia span, .balao .meta, .pilula, .marca-motivo,
  .traco .legenda, details.tabela summary, .carregando, .dia-sep, .horas-eixo, .rail .pe, .diario .q, .periodo button {
    text-transform:none; letter-spacing:0; font-family:var(--sans); }
  .rail .grupo { font-size:12px; font-weight:600; opacity:.6; padding:18px 12px 6px; }
  .instrumentos small { font-size:12.5px; font-weight:600; color:var(--tinta-3); }
  .instrumentos b { font-weight:800; letter-spacing:-.03em; }
  .instrumentos { border-radius:14px; background:var(--caixa); }
  th { font-size:12px; font-weight:600; }
  .pilula { font-size:12px; font-weight:600; padding:3px 10px; }
  .marca-motivo { font-size:11.5px; font-weight:700; padding:3px 8px; border-radius:999px; }
  .balao .meta { font-size:11px; font-weight:600; }
  .periodo { border-radius:10px; }
  .periodo button { font-size:12.5px; font-weight:600; min-height:34px; padding:0 12px; }
  .periodo button[aria-pressed="true"] { background:var(--tinta); color:var(--caixa); }
  .btn { border-radius:10px; min-height:34px; font-weight:600; }
  .btn:focus-visible, input:focus-visible, .linha:focus-visible, .rail a:focus-visible, .periodo button:focus-visible, .aba:focus-visible,
  .pessoa:focus-visible, .card-maq:focus-visible, a.acao:focus-visible, button.acao:focus-visible { outline:2px solid var(--ouro); outline-offset:2px; }
  .metricas { flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; padding-bottom:2px; }
  .metricas::-webkit-scrollbar { display:none; }
  .metricas button { flex:none; }
  .inbox, .vazio-fila { border-radius:14px; }
  .rail .marca b i { color:var(--ouro); }
  .luz.ok { background:#34C98E; }

  /* trilho: Agora com o contador, Análise, e as maquinas pelo nome da conta */
  .rail a .cont { margin-left:auto; font:700 11.5px/18px var(--sans); min-width:20px; height:20px; padding:0 6px; border-radius:999px; text-align:center; background:var(--ouro); color:#1A1D21; flex:none; }
  .rail a .fila { font-family:var(--sans); }
  .rail .vagas { display:block; padding:8px 12px; font-size:12px; color:var(--laje-texto); opacity:.55; }
  /* o icone do trilho tambem se chama .grade, como a grade dos blocos de
     padrao, e herdava a margem dela: ficava meia linha abaixo do texto */
  .rail a svg.grade { margin:0; display:block; }
  @media (prefers-color-scheme: dark) { .acao.ligar { color:#08130E; } }

  /* topo de cada tela */
  .topo { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .topo .ferramentas { display:flex; gap:8px; align-items:center; }
  .topo .quando { color:var(--tinta-3); font-size:13px; margin-top:4px; }

  /* maquina parada: alerta em cima da fila, nao o titulo da pagina */
  .alertas { display:grid; gap:8px; margin-top:20px; }
  .alerta-maq { display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:14px; background:var(--brasa-luz); color:var(--brasa); border:1px solid color-mix(in srgb, var(--brasa) 22%, transparent); text-align:left; width:100%; cursor:pointer; font-size:13.5px; }
  .alerta-maq b { font-weight:700; }
  .alerta-maq span.o-que { color:var(--tinta-2); }
  .alerta-maq .ir { margin-left:auto; font-weight:600; font-size:12.5px; white-space:nowrap; }

  /* a fila */
  .fila-cab { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-top:28px; }
  .fila-cab h2 { margin:0; font-size:20px; font-weight:800; letter-spacing:-.03em; }
  .fila-cab .partes { color:var(--tinta-3); font-size:13.5px; }
  .fila-cab .partes b { color:var(--tinta); font-weight:700; }
  .pessoas { display:grid; gap:8px; margin-top:14px; }
  .pessoa { display:grid; grid-template-columns:76px 40px minmax(0,1fr) auto; align-items:center; gap:14px; padding:14px 16px; background:var(--caixa); border:1px solid var(--linha); border-radius:14px; cursor:pointer; text-align:left; }
  .pessoa:hover { border-color:var(--tinta-4); }
  .pessoa .espera { font:800 20px/1 var(--sans); letter-spacing:-.03em; }
  .pessoa .espera small { display:block; font-size:11.5px; font-weight:500; letter-spacing:0; color:var(--tinta-3); margin-top:4px; }
  .espera.verde { color:var(--dinheiro); } .espera.ambar { color:var(--ambar-ink); } .espera.vermelho { color:var(--brasa); } .espera.frio { color:var(--tinta-4); }
  .pessoa .ava { width:40px; height:40px; font-size:15px; }
  .pessoa .t { min-width:0; }
  .pessoa .l1 { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .pessoa .quem { font-weight:700; font-size:15px; }
  .pessoa .carro { color:var(--tinta-2); font-size:13.5px; }
  .pessoa .resumo { color:var(--tinta-3); font-size:12.5px; margin-top:3px; display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; }
  .chip-maq { font-size:11.5px; font-weight:600; padding:2px 8px; border-radius:999px; background:var(--nevoa); color:var(--tinta-2); white-space:nowrap; }
  .pessoa .acoes { display:flex; gap:6px; align-items:center; }
  .acao { display:inline-flex; align-items:center; gap:7px; min-height:36px; padding:0 12px; border-radius:10px; border:1px solid var(--linha); background:var(--caixa); color:var(--tinta); font-size:13px; font-weight:600; text-decoration:none; cursor:pointer; white-space:nowrap; }
  .acao:hover { border-color:var(--tinta-4); }
  .acao svg { width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  .acao.ligar { background:var(--dinheiro); border-color:var(--dinheiro); color:#fff; }
  .acao.ligar:hover { filter:brightness(1.07); }
  .acao.ligar .num { font-weight:600; opacity:.9; }
  .acao.so-icone { width:36px; padding:0; justify-content:center; }
  .acao.feito { color:var(--dinheiro); border-color:var(--dinheiro); }

  /* as maquinas, em cartoes */
  .cards-maq { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:12px; margin-top:14px; }
  .card-maq { display:flex; flex-direction:column; gap:12px; padding:16px; background:var(--caixa); border:1px solid var(--linha); border-radius:14px; cursor:pointer; text-align:left; width:100%; }
  .card-maq:hover { border-color:var(--tinta-4); }
  .card-maq .c1 { display:flex; align-items:center; gap:10px; }
  .card-maq .c1 .nome { font-weight:800; font-size:16px; letter-spacing:-.02em; }
  .card-maq .c1 .conta { color:var(--tinta-3); font-size:12.5px; }
  .card-maq .c1 .sinal { margin-left:auto; font-size:12px; color:var(--tinta-3); white-space:nowrap; }
  .card-maq .faz { font-size:13px; color:var(--tinta-2); min-height:2.6em; }
  .card-maq .faz.alerta { color:var(--brasa); font-weight:600; }
  .card-maq .nums { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; border-top:1px solid var(--linha-2); padding-top:12px; }
  .card-maq .nums b { display:block; font-size:20px; font-weight:800; letter-spacing:-.03em; }
  .card-maq .nums b.zero { color:var(--tinta-4); font-weight:600; }
  .card-maq .nums b.bom { color:var(--dinheiro); }
  .card-maq .nums small { color:var(--tinta-3); font-size:12px; }
  .card-maq .luz { box-shadow:inset 0 0 0 1.5px var(--tinta-4); }
  .card-maq.livre { border-style:dashed; background:transparent; cursor:default; justify-content:center; color:var(--tinta-3); font-size:13px; }
  .card-maq.livre b { color:var(--tinta); font-size:15px; font-weight:700; display:block; margin-bottom:2px; }

  /* ------------------------------------------------ responsivo 13/10 ---
     Medido em 1280, 1024, 820, 600 e 390 px. */
  /* os numeros da maquina: grade que se reparte por igual, com a divisoria
     desenhada pelo vao (1px) - nenhum numero fica sozinho numa linha, e a
     linha nunca some quando quebra */
  .instrumentos { display:flex; flex-wrap:wrap; gap:1px; background:var(--linha); border:1px solid var(--linha); }
  /* flex, nao grade: o que sobra na ultima linha se reparte entre os numeros
     dela, e nao vira celula cinza vazia */
  .instrumentos div { flex:1 1 160px; border-left:0; background:var(--caixa); }
  /* abas e filtros rolam de lado em vez de quebrar em duas linhas */
  .abas, .filtros { flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; }
  .abas::-webkit-scrollbar, .filtros::-webkit-scrollbar { display:none; }
  .aba, .filtros button { flex:none; white-space:nowrap; }
  /* caixa de entrada: lado a lado so com largura de sobra; abaixo disso,
     a lista e a conversa se revezam, como no celular */
  @media (max-width:1180px) {
    .inbox { grid-template-columns:1fr; height:auto; min-height:0; }
    .inbox .coluna { border-right:0; max-height:70vh; }
    .inbox.lendo .coluna { display:none; }
    .inbox:not(.lendo) .papo { display:none; }
    .inbox.lendo .papo { height:min(78vh, 760px); }
    .papo .voltar-conv { display:inline-flex; }
  }
  /* entre o celular e o notebook: o botao Ligar nao estica a tela inteira */
  @media (min-width:601px) and (max-width:900px) {
    .pessoa .acoes a.acao.ligar { flex:0 1 auto; padding:0 18px; }
  }

  /* ---------------------------------------------------------- celular --- */
  @media (max-width:900px) {
    /* no celular a régua vira a barra de baixo: a coluna escura da esquerda
       nao existe mais, e pintar a tinta ali comia a metade do texto */
    .app { grid-template-columns:1fr; padding-bottom:64px; background:var(--papel); }
    .rail { position:fixed; top:auto; bottom:0; left:0; right:0; height:62px; flex-direction:row; align-items:center; z-index:40; border-top:1px solid var(--laje-line); }
    .rail .marca, .rail .pe, .rail .grupo { display:none; }
    .rail nav { flex-direction:row; flex:1; padding:8px; gap:4px; overflow-x:auto; }
    .rail a { flex:1 1 0; flex-direction:column; justify-content:center; gap:3px; padding:4px 6px; min-width:64px; max-width:120px; font-size:11px; line-height:1.2; text-align:center; }
    .rail nav { justify-content:space-around; }
    .rail a svg.grade { width:15px; height:15px; }

    .rail a b { flex:none; max-width:72px; }
    .rail a .idade { display:none; }
    .linha { grid-template-columns:52px minmax(0,1fr); gap:10px; padding:12px 4px; align-items:start; }
    .linha > .idade { padding-top:2px; }
    .linha .onde { margin-top:3px; }
    .linha .direita { grid-column:2; justify-content:flex-start; margin-top:4px; }
    .maq { grid-template-columns:14px minmax(0,1fr) auto; }
    .maq .faz, .maq .traco { display:none; }
    .inbox { grid-template-columns:1fr; min-height:0; }
    .inbox .coluna { border-right:0; }
    .inbox.lendo .coluna { display:none; }
    .inbox:not(.lendo) .papo { display:none; }
    .papo .voltar-conv { display:inline-flex; }
    .conversas, .rolo { max-height:none; }
    .barra-linha { grid-template-columns:minmax(90px,120px) minmax(0,1fr) 54px; gap:10px; }
    .pessoa { grid-template-columns:40px minmax(0,1fr); gap:6px 12px; padding:14px; }
    .pessoa .espera { grid-column:2; grid-row:1; font-size:15px; display:flex; gap:6px; align-items:baseline; }
    .pessoa .espera small { display:inline; margin:0; }

    .pessoa .acoes .acao { min-height:44px; }

    /* o contador mora no canto do icone, nunca em cima do nome */
    .rail a .cont, .rail a .fila { position:absolute; top:1px; left:calc(50% + 4px); right:auto; margin:0; min-width:18px; height:18px; line-height:16px; font-size:10.5px; }
    .alerta-maq { flex-wrap:wrap; }

  }
</style>

<body>

<div id="entradaTela" hidden>
